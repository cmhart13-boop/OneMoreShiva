name: Shiva Edge Prototype Audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile production
        run: python -m py_compile app.py app_core.py shiva_home_v2.py shiva_product.py shiva_draft_guide.py shiva_draft_iq.py shiva_coach.py shiva_live.py
      - name: Edge acceptance criteria
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('shiva_home_v2.py').read_text()
          required=[
            'Raise the Floor →','Keep the Ceiling →','shiva_edge_mode',
            'Safest weekly scoring profiles','Highest week-winning upside',
            'minimum 8 games with verified weekly results','View player →',
            'Shiva Blast','news-grid','render_countdown()'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'Missing acceptance criteria: {missing}'
          assert 'placeholder' not in s.lower()
          PY
      - name: Runtime Home and interaction
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py', default_timeout=60).run()
          assert not at.exception, at.exception
          labels=[b.label for b in at.button]
          assert 'Raise the Floor →' in labels
          assert 'Keep the Ceiling →' in labels
          floor=next(b for b in at.button if b.label=='Raise the Floor →')
          floor.click().run()
          assert not at.exception, at.exception
          assert any('Close Shiva Edge rankings'==b.label for b in at.button)
          PY
      - name: Product and UX audits
        run: |
          python scripts/audit_product.py
          python scripts/audit_ux_v3.py
      - name: Cleanup audit workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/edge-prototype-audit.yml
          git commit -m "Remove Shiva Edge prototype audit workflow"
          git push
