name: Restyle Shiva Answer
on:
  push:
    paths:
      - scripts/restyle_shiva_answer.py
      - .github/workflows/restyle-shiva-answer.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Shiva answer presentation
        run: python scripts/restyle_shiva_answer.py
      - name: Commit answer UI
        run: |
          git config user.name "cmhart13-boop"
          git config user.email "cmhart13@gmail.com"
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m "Make Shiva answers readable and collapsible"
            git push
          fi
