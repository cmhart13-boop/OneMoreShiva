name: Complete Shiva Experience

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-shiva-experience.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Shiva experience
        run: python tools/complete_experience.py
      - name: Syntax check
        run: python -m py_compile app.py app_core.py shiva_coach.py shiva_draft_guide.py shiva_draft_iq.py
      - name: Commit completed experience
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_core.py shiva_draft_guide.py shiva_coach.py
          git commit -m 'Build full Shiva decision experience'
          git push
