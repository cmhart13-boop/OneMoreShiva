name: Verify Three Mobile Fixes

on:
  push:
    paths:
      - '.github/verify-mobile-three-fixes-trigger'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed source contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          blast=s[s.index('def _home_shiva_blast():'):s.index('\ndef _home_nfl_news():',s.index('def _home_shiva_blast():'))]
          assert "host.style.top='0';host.style.right='0'" in blast
          assert '🧠 SHIVA BLAST' not in blast and '⚡ SHIVA BLAST' not in blast
          assert '[data-testid="stAppDeployButton"]' in s and '[aria-label="Manage app"]' in s
          print('HEADER/UI SOURCE CONTRACTS PASS')
          PY
      - name: Inspect ESPN real-time headline schema
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request,urlopen
          u='https://now.core.api.espn.com/v1/sports/news?limit=20&sport=football'
          req=Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urlopen(req,timeout=15) as r:data=json.loads(r.read().decode('utf-8'))
          items=data.get('headlines') or []
          print('HEADLINE COUNT',len(items))
          assert items, 'No headlines returned from ESPN real-time news API'
          print('FIRST HEADLINE KEYS',list(items[0].keys()))
          print(json.dumps(items[0],indent=2)[:16000])
          PY
      - name: Verify Python syntax
        run: python -m py_compile app.py app_core.py shiva_draft_guide.py shiva_draft_iq.py
