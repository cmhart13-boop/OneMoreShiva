name: Verify Three Mobile Fixes

on:
  push:
    paths:
      - '.github/verify-mobile-three-fixes-trigger'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed header UI contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          blast=s[s.index('def _home_shiva_blast():'):s.index('\ndef _home_nfl_news():',s.index('def _home_shiva_blast():'))]
          assert "host.style.top='0';host.style.right='0'" in blast
          assert '🧠 SHIVA BLAST' not in blast and '⚡ SHIVA BLAST' not in blast
          assert '[data-testid="stAppDeployButton"]' in s and '[aria-label="Manage app"]' in s
          print('HEADER/UI SOURCE CONTRACTS PASS')
          PY
      - name: Verify four ESPN story links and thumbnails
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request,urlopen
          u='https://now.core.api.espn.com/v1/sports/news?limit=30&sport=football&leagues=nfl'
          req=Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urlopen(req,timeout=15) as r:data=json.loads(r.read().decode('utf-8'))
          out=[]
          for a in data.get('headlines') or []:
              if str(a.get('type') or '').casefold() != 'story':
                  continue
              headline=str(a.get('headline') or a.get('title') or '').strip()
              links=a.get('links') or {}
              web=((links.get('web') or {}).get('href')
                   or ((links.get('web') or {}).get('self') or {}).get('href')
                   or (links.get('mobile') or {}).get('href'))
              img=next((x.get('url') for x in (a.get('images') or []) if isinstance(x,dict) and x.get('url')),None)
              if headline and web and img and 'espn.com' in web:
                  out.append((headline,web,img))
              if len(out)==4:
                  break
          assert len(out)==4, f'Only {len(out)} usable ESPN stories found'
          print('ESPN FOUR-STORY CONTRACT PASS')
          for i,row in enumerate(out,1):print(i,*row)
          PY
      - name: Verify Python syntax
        run: python -m py_compile app.py app_core.py shiva_draft_guide.py shiva_draft_iq.py
