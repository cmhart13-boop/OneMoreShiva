name: Shiva Draft Guide branding cleanup
on:
  push:
    paths:
      - '.github/workflows/shiva-brand-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebrand draft intelligence as Shiva
        run: |
          python - <<'PY'
          from pathlib import Path

          old_module = Path('joel_ppr_2026.py')
          new_module = Path('shiva_ppr_2026.py')
          if old_module.exists():
              text = old_module.read_text()
              text = text.replace("derived from Joel Smyth's 2026 Draft Guide", "for the Shiva 2026 Draft Guide")
              text = text.replace("Joel still sees", "Shiva flags")
              text = text.replace("Joel flags", "Shiva flags")
              text = text.replace("Joel expects", "Shiva expects")
              text = text.replace("Joel's luck model", "Shiva Luck Metric")
              text = text.replace("Joel's median", "Shiva's median")
              text = text.replace("Joel views", "Shiva views")
              text = text.replace("Joel highlights", "Shiva highlights")
              text = text.replace("Joel PPR rank", "Shiva PPR rank")
              new_module.write_text(text)
              old_module.unlink()

          app = Path('app.py')
          s = app.read_text()
          s = s.replace('from joel_ppr_2026 import DRAFT_RULES, player_payload, shiva_context', 'from shiva_ppr_2026 import DRAFT_RULES, player_payload, shiva_context')
          s = s.replace('joel=player_payload(str(p["name"]))', 'shiva_intel=player_payload(str(p["name"]))')
          s = s.replace('joel.values()', 'shiva_intel.values()')
          s = s.replace('joel.get(', 'shiva_intel.get(')
          s = s.replace('joel[', 'shiva_intel[')
          s = s.replace('Joel Smyth · 2026 PPR Intel', 'Shiva Draft Guide · 2026 PPR')
          s = s.replace('joel_context=shiva_context(names)', 'shiva_draft_context=shiva_context(names)')
          s = s.replace('Joel Smyth 2026 full-PPR draft intelligence: {joel_context}. Joel PPR strategy rules: {DRAFT_RULES}. Use Joel data as an analyst input, label it as Joel-based when material, and do not treat Half-PPR or dynasty data as part of this context.', 'Shiva Draft Guide 2026 full-PPR intelligence: {shiva_draft_context}. Shiva PPR strategy rules: {DRAFT_RULES}. Use this Shiva Draft Guide data as an internal draft-intelligence input, and do not treat Half-PPR or dynasty data as part of this context.')
          app.write_text(s)

          old_workflow = Path('.github/workflows/install-joel-ppr-intel.yml')
          if old_workflow.exists():
              old_workflow.unlink()

          # Remove this one-time installer from the resulting tree as well.
          self_path = Path('.github/workflows/shiva-brand-cleanup.yml')
          if self_path.exists():
              self_path.unlink()
          PY
      - name: Validate Python syntax
        run: python -m py_compile app.py shiva_ppr_2026.py
      - name: Verify current tree has no third-party analyst branding
        run: |
          if grep -RniE 'Joel Smyth|joel_ppr|Joel PPR|Joel-based' app.py shiva_ppr_2026.py .github/workflows 2>/dev/null; then
            echo 'Third-party branding still present'
            exit 1
          fi
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand 2026 PPR intelligence as Shiva Draft Guide"
          git push
