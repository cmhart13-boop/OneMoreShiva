name: Apply Shiva Guide
on:
  push:
    paths: ['.shiva-guide-trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          a='import streamlit.components.v1 as components\n'
          if 'from shiva_draft_guide import render_draft_guide' not in s: s=s.replace(a,a+'from shiva_draft_guide import render_draft_guide\n',1)
          s=s.replace('PAGES = ["Home","Draft","Players","Shiva","Roster"]','PAGES = ["Home","Draft","Guide","Players","Shiva","Roster"]')
          s=s.replace('ICONS = {"Home":"⌂","Draft":"🏈","Players":"👥","Shiva":"✦","Roster":"☷"}','ICONS = {"Home":"⌂","Draft":"🏈","Guide":"📖","Players":"👥","Shiva":"✦","Roster":"☷"}')
          s=s.replace('grid-template-columns:repeat(5,1fr);padding:6px 8px calc(8px + env(safe-area-inset-bottom))','grid-template-columns:repeat(6,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom))')
          if 'def draft_guide():' not in s: s=s.replace('def draft():\n','def draft_guide():\n    screen_head("2026 Shiva Draft Guide","Full-PPR intelligence built for draft-day decisions.")\n    render_draft_guide()\n\ndef draft():\n',1)
          s=s.replace('{"Home":home,"Draft":draft,"Players":player_db,"Shiva":shiva,"Roster":roster_screen}[page]()','{"Home":home,"Draft":draft,"Guide":draft_guide,"Players":player_db,"Shiva":shiva,"Roster":roster_screen}[page]()')
          p.write_text(s)
          PY
          python -m py_compile app.py shiva_draft_guide.py
          git config user.name 'Shiva App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || (git commit -m 'Install 2026 Shiva Draft Guide' && git push)
