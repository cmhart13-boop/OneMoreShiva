name: Replace Shiva Logo Ornate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-shiva-logo-ornate.yml']
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Replace logo
        run: python scripts/replace_shiva_logo_ornate.py
      - name: Compile
        run: python -m py_compile app.py app_core.py shiva_home_v2.py shiva_product.py shiva_live.py shiva_coach.py shiva_draft_guide.py shiva_draft_iq.py
      - name: Product audit
        run: python scripts/audit_product.py
      - name: UX audit
        run: python scripts/audit_ux_v3.py
      - name: Runtime smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for page in ['Home','Draft','Guide','Coach']:
              at=AppTest.from_file('app.py'); at.query_params['page']=page; at.run(timeout=40)
              if len(at.exception): raise SystemExit(f'{page}: {at.exception}')
              print('PASS', page)
          PY
      - name: Commit logo and clean one-shot tooling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_core.py
          git rm scripts/replace_shiva_logo_ornate.py .github/workflows/replace-shiva-logo-ornate.yml
          git commit -m 'Replace minimal Shiva mark with ornate trophy logo'
          git push
