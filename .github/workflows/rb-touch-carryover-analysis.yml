name: RB Touch Carryover Analysis
on:
  push:
    branches:
      - analysis/rb-touch-carryover-20260831
    paths:
      - 'scripts/rb_touch_carryover_report.py'
      - '.github/workflows/rb-touch-carryover-analysis.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run RB touch carryover report
        run: python scripts/rb_touch_carryover_report.py
      - name: Commit analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_output/rb_touch_summary.json analysis_output/rb_touch_player_seasons.csv
          git diff --cached --quiet && exit 0
          git commit -m "Generate RB touch carryover analysis"
          git push
# trigger after workflow registration on default branch
