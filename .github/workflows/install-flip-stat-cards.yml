name: Install Flip Stat Cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-flip-stat-cards.yml'
      - '.github/scripts/install_flip_stat_cards.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mobile flip stat cards
        run: python .github/scripts/install_flip_stat_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Add tappable flip stat cards to home screen"
          git push
