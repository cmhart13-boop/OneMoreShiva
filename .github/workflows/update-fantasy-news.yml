name: Update Fantasy News

on:
  push:
    paths:
      - '.github/fantasy-news-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Home fantasy news section only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          start = text.index('def _home_nfl_news():')
          end = text.index('\ndef home():', start)

          new_fn = r'''def _home_nfl_news():
    st.markdown("#### Fantasy News")
    try:
        import json as _json
        from urllib.request import Request as _Request, urlopen as _urlopen

        # ESPN's public site-facing NFL news API is the live source used here.
        # We keep every fantasy-football article returned by ESPN rather than truncating to four.
        req=_Request(
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=100",
            headers={"User-Agent":"Mozilla/5.0 (iPhone; Shiva Fantasy Football)"},
        )
        with _urlopen(req,timeout=10) as resp:
            data=_json.loads(resp.read().decode("utf-8"))

        articles=[]
        seen=set()
        for a in data.get("articles",[]):
            headline=str(a.get("headline") or "").strip()
            description=str(a.get("description") or "").strip()
            links=a.get("links",{}) or {}
            web=(links.get("web",{}) or {}).get("href") or (links.get("mobile",{}) or {}).get("href")
            if not headline or not web:
                continue

            hay=(headline+" "+description+" "+str(web)).casefold()
            # Match ESPN Fantasy Football homepage-style content: fantasy football stories and /fantasy/football/ destinations.
            if "/fantasy/football/" not in hay and "fantasy football" not in hay:
                continue
            if web in seen:
                continue
            seen.add(web)

            imgs=a.get("images") or []
            img=""
            for candidate in imgs:
                if isinstance(candidate,dict) and candidate.get("url"):
                    img=str(candidate.get("url"))
                    break

            articles.append((headline,web,img,description))

        if not articles:
            st.caption("Fantasy news is refreshing from ESPN.")
            return

        cards=[]
        for headline,web,img,description in articles:
            h=html.escape(headline)
            u=html.escape(web,quote=True)
            d=html.escape(description)
            if img:
                im=html.escape(img,quote=True)
                media=f'<div class="fantasy-news-img"><img src="{im}" alt=""></div>'
            else:
                media=''
            desc=f'<div class="fantasy-news-desc">{d}</div>' if d else ''
            cards.append(
                f'<a class="fantasy-news-card" href="{u}" target="_blank" rel="noopener noreferrer">'
                f'{media}<div class="fantasy-news-body"><div class="fantasy-news-headline">{h}</div>{desc}'
                f'<div class="fantasy-news-meta">ESPN · Fantasy Football</div></div></a>'
            )

        news_css_html = """
        <style>
        .fantasy-news-list{display:flex;flex-direction:column;gap:9px;margin:7px 0 14px}
        .fantasy-news-card{display:grid;grid-template-columns:112px minmax(0,1fr);overflow:hidden;text-decoration:none!important;color:#fff!important;background:#0e1821;border:1px solid #253644;border-radius:9px;min-height:86px}
        .fantasy-news-card:not(:has(.fantasy-news-img)){grid-template-columns:1fr}
        .fantasy-news-img{width:112px;height:100%;min-height:86px;background:#172430;overflow:hidden}
        .fantasy-news-img img{display:block;width:100%;height:100%;object-fit:cover}
        .fantasy-news-body{padding:9px 10px 10px;min-width:0}
        .fantasy-news-headline{font-size:13px;font-weight:950;line-height:1.27;color:#fff}
        .fantasy-news-desc{font-size:10.5px;line-height:1.32;color:#9eacb7;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .fantasy-news-meta{font-size:9px;color:#8fa0ae;margin-top:7px;font-weight:850;text-transform:uppercase;letter-spacing:.15px}
        @media(max-width:430px){.fantasy-news-card{grid-template-columns:96px minmax(0,1fr);min-height:80px}.fantasy-news-img{width:96px;min-height:80px}.fantasy-news-headline{font-size:12.5px}.fantasy-news-desc{font-size:10px}}
        </style><div class="fantasy-news-list">""" + "".join(cards) + "</div>"
        st.markdown(news_css_html,unsafe_allow_html=True)
    except Exception:
        st.caption("Fantasy news is refreshing from ESPN.")
'''

          text = text[:start] + new_fn + text[end:]
          app.write_text(text, encoding='utf-8')

          checks = {
              'Fantasy News heading': 'st.markdown("#### Fantasy News")' in text,
              'ESPN public API': 'site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=100' in text,
              'all matching stories retained': 'if len(articles)==4:break' not in text[start:text.index('\ndef home():', start)],
              'real ESPN links': 'href=\\"{u}\\" target=\\"_blank\\"' in text,
              'thumbnail supported': 'fantasy-news-img' in text and 'candidate.get("url")' in text,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('FAILED: '+', '.join(failed))
          print('FANTASY NEWS SOURCE CHECKS PASSED')
          for k in checks: print(' -',k)
          PY

      - name: Syntax check
        run: python -m py_compile app.py app_core.py shiva_draft_guide.py shiva_draft_iq.py

      - name: Commit verified Fantasy News update
        shell: bash
        run: |
          git config user.name "Shiva News Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/fantasy-news-trigger
          git add app.py .github/fantasy-news-trigger
          git commit -m "Link Home Fantasy News to ESPN live articles" || exit 0
          git push
