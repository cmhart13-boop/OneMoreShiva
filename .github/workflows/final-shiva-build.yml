name: Final Shiva Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-shiva-build.yml'
      - 'scripts/update_live_context.py'

permissions:
  contents: write

jobs:
  build-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install final product wiring
        run: python tools/install_final_shiva.py
      - name: Refresh verified live context
        run: python scripts/update_live_context.py
      - name: Compile everything
        run: python -m py_compile app.py app_core.py shiva_live.py shiva_product.py shiva_coach.py shiva_draft_guide.py shiva_draft_iq.py scripts/audit_product.py
      - name: Double audit
        run: python scripts/audit_product.py
      - name: Streamlit runtime smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for page in ['Shiva','Coach','Guide','Draft']:
              at=AppTest.from_file('app.py')
              at.query_params['page']=page
              at.run(timeout=35)
              if len(at.exception):
                  raise SystemExit(f'{page} runtime exception: {at.exception}')
              print('RUNTIME PASS',page)
          PY
      - name: Commit production build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_core.py data/
          git commit -m 'Complete Shiva product build and audit' || true
          git push
