name: No Flash Contract

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_shiva_splash_fix.py'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  no-flash-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply contract alignment
        if: github.event_name == 'push'
        run: python scripts/apply_shiva_splash_fix.py
      - name: Compile runtime
        if: github.event_name == 'push'
        run: python -m py_compile app.py app_runtime.py tests/test_no_flash_contract.py
      - name: Commit aligned contract
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Shiva App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app_runtime.py tests/test_no_flash_contract.py
          git commit -m "Lock canonical Shiva splash contract"
          git push origin main
      - name: Contract tests
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip pytest
          pytest -q tests/test_no_flash_contract.py tests/test_home_layout_contract.py
