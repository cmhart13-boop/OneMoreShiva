name: No Flash Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-flash-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest Pillow
      - run: pytest -q tests/test_no_flash_contract.py tests/test_home_layout_contract.py tests/test_splash_bootstrap_contract.py
