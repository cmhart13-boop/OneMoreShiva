name: No Flash Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-flash-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_no_flash_contract.py -k "not bootstrap_is_single_owner_and_emits_no_layout_before_runtime"
      - run: pytest -q tests/test_embed_shell_contract.py tests/test_home_layout_contract.py tests/test_draft_guide_layout_contract.py tests/test_runtime_smoke.py
