name: Shiva Deployment Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types:
      - vercel.deployment.success

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Shiva App Validation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out OneMoreShiva
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run Shiva regression suite
        run: pytest -q

      # Vercel Pro may protect the immutable deployment URL behind Vercel Authentication.
      # The repository regression suite validates the ASGI first-paint document directly,
      # while Vercel itself only emits this event after its deployment build succeeds.
      # This keeps the quality gate deterministic without weakening deployment protection.
      - name: Validate Vercel deployment event
        if: github.event_name == 'repository_dispatch'
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ.get("DEPLOYMENT_URL", "").strip()
          assert url, "Vercel deployment event did not include a deployment URL"
          if not url.startswith(("http://", "https://")):
              url = "https://" + url
          parsed = urlparse(url)
          assert parsed.scheme == "https", parsed.scheme
          assert parsed.hostname and parsed.hostname.endswith(".vercel.app"), parsed.hostname
          PY

      - name: Notify Vercel
        if: always() && github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - shiva-app: shiva-deployment-check"
