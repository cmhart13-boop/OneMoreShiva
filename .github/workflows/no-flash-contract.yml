name: Shiva Deployment Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types:
      - vercel.deployment.success

permissions:
  contents: read

jobs:
  validate:
    name: Shiva App Validation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out OneMoreShiva
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run Shiva regression suite
        run: pytest -q

      - name: Smoke-test the deployed Vercel document
        if: github.event_name == 'repository_dispatch'
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          url = os.environ["DEPLOYMENT_URL"].strip()
          if not url.startswith(("http://", "https://")):
              url = "https://" + url

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Shiva-Deployment-Check/1.0"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8")
              assert response.status == 200, response.status
              assert 'id="shiva-first-paint"' in html
              assert 'id="shiva-launch-shell"' in html
              assert "#071019" in html
          PY

      - name: Notify Vercel
        if: always() && github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - shiva-app: shiva-deployment-check"
