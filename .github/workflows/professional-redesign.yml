name: Surgical Shiva Home Fix
on:
  push:
    paths:
      - scripts/nova_canonical_fix.py
      - .github/workflows/professional-redesign.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested Shiva home changes
        run: python scripts/nova_canonical_fix.py
      - name: Commit requested changes
        run: |
          git config user.name "cmhart13-boop"
          git config user.email "cmhart13@gmail.com"
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m "Restore Shiva Blast and update only Shiva Intelligence card"
            git push
          fi