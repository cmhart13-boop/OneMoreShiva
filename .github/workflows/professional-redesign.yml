name: Professional Redesign
on:
  push:
    paths:
      - scripts/nova_canonical_fix.py
      - .github/workflows/professional-redesign.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical Shiva home fix
        run: python scripts/nova_canonical_fix.py
      - name: Validate Python
        run: python -m py_compile app.py shiva_draft_guide.py app_core.py
      - name: Commit surgical Shiva home fix
        run: |
          git config user.name "cmhart13-boop"
          git config user.email "cmhart13@gmail.com"
          git add app.py shiva_draft_guide.py
          if ! git diff --cached --quiet; then
            git commit -m "Restore Shiva Blast and Shiva Intelligence card"
            git push
          fi