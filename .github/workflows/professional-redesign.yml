name: Surgical Shiva Home Fix
on:
  push:
    paths:
      - scripts/repair_requested_shiva_ui.py
      - .github/workflows/professional-redesign.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested Shiva UI changes
        run: python scripts/repair_requested_shiva_ui.py
      - name: Syntax validation
        run: python -m py_compile app.py app_core.py shiva_draft_guide.py
      - name: Audit Shiva Blast and Intelligence card
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          checks={
            'blast function':'def _home_shiva_blast():' in s,
            'blast header call':'_home_shiva_blast()' in s[s.find('def app_header():'):s.find('def bottom_nav',s.find('def app_header():'))],
            'blast button':'id="shivaBlast"' in s,
            'blast top-right':'top:8px;right:112px' in s,
            'blast video':'Blasting_compressed.mp4' in s,
            'blast click':'btn.addEventListener(\'click\'' in s,
            'blast open':'stage.classList.add(\'open\')' in s,
            'blast autoplay':'video.play()' in s,
            'intelligence card css':'SURGICAL HOME SHIVA CARD' in s,
            'intelligence brain':'home-shiva-brain' in s,
            'soft 3d border':'box-shadow:inset 0 1px 0 rgba(166,214,255,.10)' in s,
          }
          failed=[k for k,v in checks.items() if not v]
          print('\n'.join(f'{k}: {"PASS" if v else "FAIL"}' for k,v in checks.items()))
          if failed: raise SystemExit('FAILED: '+', '.join(failed))
          PY
      - name: Commit requested changes
        run: |
          git config user.name "cmhart13-boop"
          git config user.email "cmhart13@gmail.com"
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m "Fix and verify Shiva Blast and Intelligence card"
            git push
          fi