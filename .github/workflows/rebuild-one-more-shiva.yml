name: Rebuild One More Shiva

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-one-more-shiva.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild product
        run: python -S tools/rebuild_product.py

      - name: Commit rebuilt product
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rebuild One More Shiva as a clean product'
          git push
