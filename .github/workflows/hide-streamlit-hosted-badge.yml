name: Hide Streamlit hosted badge safely

on:
  push:
    paths:
      - '.github/workflows/hide-streamlit-hosted-badge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add isolated hosted-badge suppressor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.py')
          text = path.read_text()
          marker = '# Streamlit Community Cloud hosted-badge suppressor'
          if marker not in text:
              import_anchor = 'import streamlit as st\n'
              if import_anchor not in text:
                  raise SystemExit('Streamlit import anchor not found')
              text = text.replace(import_anchor, import_anchor + 'import streamlit.components.v1 as components\n', 1)
              render_anchor = 'st.markdown(CSS, unsafe_allow_html=True)\n'
              if render_anchor not in text:
                  raise SystemExit('CSS render anchor not found')
              injection = '''\n# Streamlit Community Cloud hosted-badge suppressor.\n# Intentionally isolated from app CSS/layout: only fixed Streamlit-hosting links are hidden.\ncomponents.html(\n    """\n    <script>\n    (() => {\n      let doc;\n      try { doc = window.top.document; } catch (_) { doc = window.parent.document; }\n      const hideHostedBadge = () => {\n        doc.querySelectorAll('a[href*="streamlit.io"]').forEach((link) => {\n          const label = `${link.textContent || ''} ${link.getAttribute('aria-label') || ''} ${link.getAttribute('title') || ''}`.toLowerCase();\n          let node = link;\n          let fixedOverlay = null;\n          for (let i = 0; i < 5 && node; i += 1, node = node.parentElement) {\n            const style = window.getComputedStyle(node);\n            if (style.position === 'fixed') { fixedOverlay = node; break; }\n          }\n          if (fixedOverlay && (label.includes('hosted with streamlit') || label.includes('made with streamlit') || link.href.includes('streamlit.io'))) {\n            fixedOverlay.style.setProperty('display', 'none', 'important');\n            fixedOverlay.style.setProperty('visibility', 'hidden', 'important');\n            fixedOverlay.style.setProperty('pointer-events', 'none', 'important');\n          }\n        });\n      };\n      hideHostedBadge();\n      const observer = new MutationObserver(hideHostedBadge);\n      observer.observe(doc.documentElement, { childList: true, subtree: true });\n      window.setTimeout(() => observer.disconnect(), 15000);\n    })();\n    </script>\n    """,\n    height=0,\n    width=0,\n)\n'''
              text = text.replace(render_anchor, render_anchor + injection, 1)
              path.write_text(text)
          PY
      - name: Validate app syntax
        run: python -m py_compile app.py
      - name: Commit only app.py change
        shell: bash
        run: |
          if git diff --quiet -- app.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Hide Streamlit hosted badge without touching app layout'
          git push
