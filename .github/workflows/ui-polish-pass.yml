name: Approved Shiva UI Polish Pass
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ui-polish-pass.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Apply narrow UI polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core_path=Path('app_core.py')
          core=core_path.read_text(encoding='utf-8')
          home_path=Path('shiva_home_v2.py')
          home=home_path.read_text(encoding='utf-8')

          # Global shell: tighten top spacing, enlarge brand, remove visible badge block.
          replacements={
            '.block-container{max-width:1120px;padding:.35rem .55rem calc(var(--nav-h) + 1.2rem)!important}':'.block-container{max-width:1120px;padding:0 .55rem calc(var(--nav-h) + 1.2rem)!important}',
            '.app-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 2px 10px}':'.app-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 7px}',
            '.brand-wrap{display:flex;align-items:center;gap:9px}':'.brand-wrap{display:flex;align-items:center;gap:11px}',
            '.brand-badge{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#ff3151,#9f071f);display:flex;align-items:center;justify-content:center;font-size:21px}':'.brand-badge{width:58px;height:58px;border-radius:0;background:transparent;display:flex;align-items:center;justify-content:center;font-size:21px;overflow:visible}',
            '.brand-title{font-size:19px;font-weight:950;letter-spacing:-.5px}':'.brand-title{font-size:27px;font-weight:950;letter-spacing:-.7px;line-height:1}',
            '.brand-sub{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.9px;text-transform:uppercase}':'.brand-sub{font-size:12.5px;color:var(--muted);font-weight:800;letter-spacing:.75px;text-transform:uppercase;margin-top:4px}',
          }
          for old,new in replacements.items():
            if old not in core: raise SystemExit('missing core css target: '+old[:60])
            core=core.replace(old,new,1)

          # Make the existing trophy art visually float on the app background instead of reading as a black square.
          polish_css='''\n/* APPROVED UI POLISH PASS — typography + trophy presentation only */\n.brand-badge .shiva-trophy-mark{width:58px!important;height:58px!important;object-fit:contain!important;border-radius:0!important;background:transparent!important;mix-blend-mode:screen!important;filter:contrast(1.05) saturate(.96)!important}\n.st-key-primary_nav_Home button{position:relative!important;padding-top:25px!important}\n.st-key-primary_nav_Home button::before{content:""!important;position:absolute!important;top:4px!important;left:50%!important;transform:translateX(-50%)!important;width:24px!important;height:24px!important;background-image:url("__SHIVA_SRC__")!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;mix-blend-mode:screen!important;filter:contrast(1.08) saturate(.92)!important}\n@media(max-width:520px){.brand-badge{width:54px!important;height:54px!important}.brand-badge .shiva-trophy-mark{width:54px!important;height:54px!important}.brand-title{font-size:26px!important}.brand-sub{font-size:12px!important}}\n'''
          m=re.search(r'<img class="shiva-trophy-mark" src="([^"]+)"',core)
          if not m: raise SystemExit('Shiva mark src not found')
          polish_css=polish_css.replace('__SHIVA_SRC__',m.group(1))
          needle="\n</style>'''"
          if needle not in core: raise SystemExit('core style terminator not found')
          core=core.replace(needle,polish_css+needle,1)

          # Home readability: do NOT alter Shiva Blast/news card CSS or behavior.
          home_replacements={
            '.home-v2{margin-top:2px}':'.home-v2{margin-top:0}',
            '.home-v2-kicker{font-size:12px;font-weight:900;letter-spacing:.9px;color:var(--sv-gold2);text-transform:uppercase}':'.home-v2-kicker{font-size:14px;font-weight:900;letter-spacing:.8px;color:var(--sv-gold2);text-transform:uppercase}',
            '.home-v2-hero p{font-size:16px;line-height:1.48;color:#c0c7cc;margin:0;max-width:720px}':'.home-v2-hero p{font-size:17px;line-height:1.5;color:#c0c7cc;margin:0;max-width:760px}',
            '.home-edge{background:#101820;border:1px solid #27333d;border-radius:16px;padding:15px}':'.home-edge{background:#101820;border:1px solid #27333d;border-radius:16px;padding:18px}',
            '.home-edge small{font-size:10px;font-weight:900;letter-spacing:.6px;color:var(--sv-gold2);text-transform:uppercase}':'.home-edge small{font-size:14px;font-weight:950;letter-spacing:.55px;color:var(--sv-gold2);text-transform:uppercase}',
            '.home-edge b{display:block;font-size:19px;color:#fff;margin:6px 0 4px}':'.home-edge b{display:block;font-size:23px;color:#fff;margin:8px 0 6px;line-height:1.12}',
            '.home-edge p{font-size:13px;line-height:1.42;color:#aab3b9;margin:0}':'.home-edge p{font-size:16px;line-height:1.48;color:#b5bec4;margin:0}',
            '.leader-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #222d35;padding:10px 0}':'.leader-row{display:flex;justify-content:space-between;gap:14px;align-items:center;border-top:1px solid #222d35;padding:14px 0}',
            '.leader-name{font-size:14px;font-weight:850;color:#fff}':'.leader-name{font-size:17.5px;font-weight:900;color:#fff;line-height:1.2}',
            '.leader-meta{font-size:11px;color:#8f9aa2;margin-top:2px}':'.leader-meta{font-size:14px;color:#a1adb5;margin-top:4px;line-height:1.3}',
            '.leader-stat{font-size:17px;font-weight:950;color:var(--sv-gold2);white-space:nowrap}':'.leader-stat{font-size:22px;font-weight:950;color:var(--sv-gold2);white-space:nowrap}',
          }
          for old,new in home_replacements.items():
            if old not in home: raise SystemExit('missing home css target: '+old[:60])
            home=home.replace(old,new,1)

          # Edge-only section title/subtitle so Shiva Blast remains exactly as approved.
          home=home.replace('<div class="home-v2-section">The Shiva Edge</div><div class="home-v2-sub">Historical evidence, not a mystery score.</div>', '<div class="home-v2-section edge-title">The Shiva Edge</div><div class="home-v2-sub edge-sub">Historical evidence, not a mystery score.</div>',1)
          edge_css='''\n.edge-title{font-size:28px!important;margin-top:22px!important}.edge-sub{font-size:16px!important;line-height:1.45!important;margin-top:-2px!important;margin-bottom:12px!important}\n@media(max-width:520px){.home-v2-hero p{font-size:16.5px!important}.home-edge{padding:17px!important}.home-edge small{font-size:14px!important}.home-edge b{font-size:22px!important}.home-edge p{font-size:16px!important}.leader-name{font-size:17px!important}.leader-meta{font-size:13.5px!important}.leader-stat{font-size:21px!important}.edge-title{font-size:27px!important}.edge-sub{font-size:15.5px!important}}\n'''
          needle="\n</style>'''"
          if needle not in home: raise SystemExit('home style terminator not found')
          home=home.replace(needle,edge_css+needle,1)

          core_path.write_text(core,encoding='utf-8')
          home_path.write_text(home,encoding='utf-8')
          print('UI POLISH APPLIED')
          PY
      - name: Compile
        run: python -m py_compile app.py app_core.py shiva_home_v2.py shiva_product.py shiva_live.py shiva_coach.py shiva_draft_guide.py shiva_draft_iq.py
      - name: Scope assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('app_core.py').read_text()
          home=Path('shiva_home_v2.py').read_text()
          assert 'font-size:27px;font-weight:950' in core
          assert 'mix-blend-mode:screen' in core
          assert '.st-key-primary_nav_Home button::before' in core
          assert 'font-size:17.5px' in home and 'font-size:22px;font-weight:950;color:var(--sv-gold2)' in home
          assert 'edge-title' in home and 'edge-sub' in home
          assert '.news-card{display:block' in home
          assert 'target="_blank"' in home
          assert 'Shiva Blast' in home
          assert 'primary_nav_Draft' not in core or 'primary_nav_' in core
          print('SCOPE ASSERTIONS PASS')
          PY
      - name: Runtime regression
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for page in ['Home','Draft','Guide','Coach']:
              at=AppTest.from_file('app.py')
              at.query_params['page']=page
              at.run(timeout=45)
              if len(at.exception): raise SystemExit(f'{page}: {at.exception}')
              print('RUNTIME PASS',page)
          PY
      - name: Product audits
        run: |
          python scripts/audit_product.py
          python scripts/audit_ux_v3.py
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/ui-polish-pass.yml
          git config user.name 'cmhart13-boop'
          git config user.email 'cmhart13@gmail.com'
          git add app_core.py shiva_home_v2.py .github/workflows/ui-polish-pass.yml
          git commit -m 'Polish Shiva home readability and trophy presentation'
          git push
