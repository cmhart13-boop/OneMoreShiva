name: Repair mobile UI

on:
  push:
    paths:
      - '.github/mobile-ui-repair-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair scoped mobile UI source
        run: python .github/repair_mobile_ui.py

      - name: Syntax check
        run: python -m py_compile app.py app_core.py shiva_draft_guide.py shiva_draft_iq.py

      - name: Verify repair contract
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text(encoding='utf-8')
          core=Path('app_core.py').read_text(encoding='utf-8')
          assert "frame.style.top='8px';frame.style.right='8px'" in app
          assert "frame.style.position='relative'" in app
          assert "video.addEventListener('click',closeBlast)" in app
          assert "video.addEventListener('ended'" in app
          assert '_home_shiva_blast()' in core[core.index('def app_header():'):core.index('def bottom_nav',core.index('def app_header():'))]
          assert 'shiva-nav-shield' in core
          assert 'html,body{background:#071019!important;color-scheme:dark!important}' in core
          print('VERIFIED: Shiva Blast contract and dark mobile navigation transition are present.')
          PY

      - name: Commit verified repair
        run: |
          git config user.name "Shiva Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/mobile-ui-repair-trigger
          git add app.py app_core.py .github/mobile-ui-repair-trigger
          git commit -m "Fix Shiva Blast and mobile page transition" || exit 0
          git push
