name: Readability
on:
  push:
    paths:
      - '.github/workflows/readability.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Apply
        run: python scripts/apply_readability.py
      - name: Verify
        run: |
          python -m py_compile app.py app_core.py shiva_draft_guide.py shiva_draft_iq.py shiva_home_v2.py shiva_coach.py shiva_product.py
          python scripts/audit_product.py
          python scripts/audit_ux_v3.py
      - name: Save
        run: |
          rm .github/workflows/readability.yml scripts/apply_readability.py
          git config user.name cmhart13-boop
          git config user.email cmhart13@gmail.com
          git add app_core.py .github/workflows/readability.yml scripts/apply_readability.py
          git commit -m 'Increase text size across all Shiva pages'
          git push
