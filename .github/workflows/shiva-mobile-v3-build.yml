name: Shiva Mobile V3 Build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shiva-mobile-v3-build.yml']
permissions:
  contents: write
jobs:
  build-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install redesign
        run: python scripts/redesign_mobile_ux_fixed.py
      - name: Refresh verified ESPN context
        run: python scripts/update_live_context.py
      - name: Compile production
        run: python -m py_compile app.py app_core.py shiva_home_v2.py shiva_product.py shiva_live.py shiva_coach.py shiva_draft_guide.py shiva_draft_iq.py scripts/audit_product.py scripts/audit_ux_v3.py
      - name: Architecture and data audit
        run: python scripts/audit_product.py
      - name: UX audit pass one
        run: python scripts/audit_ux_v3.py
      - name: Runtime smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for page in ['Home','Draft','Guide','Coach','Players']:
              at=AppTest.from_file('app.py')
              at.query_params['page']=page
              at.run(timeout=40)
              if len(at.exception): raise SystemExit(f'{page}: {at.exception}')
              print('RUNTIME PASS',page)
          PY
      - name: UX audit pass two
        run: python scripts/audit_ux_v3.py
      - name: Commit redesigned production app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_core.py shiva_home_v2.py shiva_product.py shiva_draft_guide.py scripts/update_live_context.py scripts/audit_product.py scripts/audit_ux_v3.py data/live_news.json data/injury_mentions.csv data/live_source_status.json
          git commit -m 'Rebuild Shiva mobile experience from ESPN and Draft Sharks review' || true
          git push
# retry after modular audit contract update
