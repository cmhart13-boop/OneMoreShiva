name: Fix Draft Guide and controls
on:
  push:
    paths:
      - '.github/workflows/fix-guide-and-controls.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('shiva_draft_guide.py')
          s = p.read_text()
          old = "    x=x.sort_values(['_gap','_rank'],ascending=[False,True]).head(limit)\n    return [(str(r.name),str(r.pos),float(r._gap),float(r._rank),float(r._adp)) for r in x.itertuples()]"
          new = "    x=x.sort_values(['_gap','_rank'],ascending=[False,True]).head(limit)\n    cols=['name','pos','_gap','_rank','_adp']\n    return [(str(name),str(pos),float(gap),float(rank),float(adp)) for name,pos,gap,rank,adp in x[cols].itertuples(index=False,name=None)]"
          if old not in s:
              raise SystemExit('Draft Guide gap block not found')
          s = s.replace(old, new, 1)
          start = s.index('/* Draft Guide section navigation:')
          end = s.index('.guide-player-link', start)
          guide_tabs = '''/* Draft Guide section navigation: compact scrollable tabs, no radio dots. */
          .st-key-guide_tab{display:block!important;width:100%!important;margin:8px 0 18px!important;overflow:hidden!important}
          .st-key-guide_tab>div,.st-key-guide_tab [data-testid="stRadio"],.st-key-guide_tab [data-baseweb="radio-group"]{width:100%!important;max-width:none!important}
          .st-key-guide_tab div[role="radiogroup"]{display:flex!important;flex-wrap:nowrap!important;gap:8px!important;width:100%!important;overflow-x:auto!important;scrollbar-width:none!important;padding:1px 1px 4px!important}
          .st-key-guide_tab div[role="radiogroup"]::-webkit-scrollbar{display:none!important}
          .st-key-guide_tab div[role="radiogroup"] label{flex:0 0 auto!important;min-width:max-content!important;min-height:44px!important;border-radius:999px!important;background:#101820!important;border:1px solid #2b3741!important;padding:10px 16px!important;display:flex!important;align-items:center!important;justify-content:center!important;margin:0!important;box-shadow:none!important;position:relative!important}
          .st-key-guide_tab div[role="radiogroup"] label:has(input:checked){background:#252015!important;border-color:#d2ae57!important;box-shadow:inset 0 0 0 1px rgba(210,174,87,.18)!important}
          .st-key-guide_tab div[role="radiogroup"] label>div:first-child,.st-key-guide_tab input[type="radio"],.st-key-guide_tab [data-baseweb="radio"]>div:first-child{display:none!important}
          .st-key-guide_tab div[role="radiogroup"] [data-testid="stMarkdownContainer"] p{font-size:14px!important;font-weight:900!important;line-height:1!important;color:#b8c1c7!important;text-transform:none!important;text-align:center!important;margin:0!important;white-space:nowrap!important}
          .st-key-guide_tab div[role="radiogroup"] label:has(input:checked) [data-testid="stMarkdownContainer"] p{color:#f4d985!important}
          @media(max-width:560px){.st-key-guide_tab div[role="radiogroup"] label{min-height:46px!important;padding:11px 15px!important}.st-key-guide_tab div[role="radiogroup"] [data-testid="stMarkdownContainer"] p{font-size:14px!important}}

          '''.replace('          ','')
          s = s[:start] + guide_tabs + s[end:]
          p.write_text(s)

          p = Path('app_core.py')
          s = p.read_text()
          old = 'div[role="radiogroup"]{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px!important;width:100%!important}div[role="radiogroup"] label{min-height:46px;background:#0e1821;border:1px solid var(--line);border-radius:11px;padding:6px!important;justify-content:center!important;margin:0!important}div[role="radiogroup"] label:has(input:checked){background:#1d2c39;border-color:#506272}div[role="radiogroup"] [data-testid="stMarkdownContainer"] p{font-size:11px!important;font-weight:900!important;white-space:nowrap!important}'
          new = 'div[role="radiogroup"]{display:flex!important;flex-wrap:wrap!important;gap:8px!important;width:100%!important}div[role="radiogroup"] label{flex:1 1 120px!important;min-height:46px!important;background:#101820!important;border:1px solid #2b3945!important;border-radius:12px!important;padding:10px 13px!important;justify-content:center!important;margin:0!important;position:relative!important;box-shadow:none!important}div[role="radiogroup"] label:has(input:checked){background:#202a33!important;border-color:#d0ad59!important;box-shadow:inset 0 -3px 0 #d0ad59!important}div[role="radiogroup"] label>div:first-child,div[role="radiogroup"] input[type="radio"],div[role="radiogroup"] [data-baseweb="radio"]>div:first-child{display:none!important}div[role="radiogroup"] [data-testid="stMarkdownContainer"]{width:100%!important;text-align:center!important}div[role="radiogroup"] [data-testid="stMarkdownContainer"] p{font-size:15px!important;font-weight:900!important;line-height:1.15!important;white-space:normal!important;margin:0!important;color:#b9c3ca!important}div[role="radiogroup"] label:has(input:checked) [data-testid="stMarkdownContainer"] p{color:#fff!important}'
          if old not in s:
              raise SystemExit('Global radio CSS block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Compile
        run: python -m py_compile app.py app_core.py shiva_draft_guide.py shiva_draft_iq.py shiva_home_v2.py shiva_coach.py shiva_product.py
      - name: Acceptance checks
        run: |
          python - <<'PY'
          import pandas as pd
          import shiva_draft_guide as g
          df=pd.DataFrame([{'name':'A','pos':'RB','overall_rank':1,'draft_adp':10},{'name':'B','pos':'WR','overall_rank':2,'draft_adp':5}])
          rows=g._board_gap_rows(df)
          assert rows and rows[0][0]=='A' and rows[0][2]==9.0, rows
          assert 'compact scrollable tabs, no radio dots' in open('shiva_draft_guide.py').read()
          assert 'box-shadow:inset 0 -3px 0 #d0ad59' in open('app_core.py').read()
          print('acceptance checks passed')
          PY
      - name: Product audits
        run: |
          python scripts/audit_product.py
          python scripts/audit_ux_v3.py
      - name: Commit and clean workflow
        run: |
          rm .github/workflows/fix-guide-and-controls.yml
          git config user.name "cmhart13-boop"
          git config user.email "cmhart13@gmail.com"
          git add app_core.py shiva_draft_guide.py .github/workflows/fix-guide-and-controls.yml
          git commit -m "Fix Draft Guide and redesign selection controls"
          git push
