name: Shiva Global Shell Recovery Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/global-shell-recovery-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Apply realistic Shiva mark
        run: python scripts/recover_global_shell.py
      - name: Restore protected same-session navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app_core.py')
          s=p.read_text(encoding='utf-8')
          nav=r'''def bottom_nav(active:str):
              active = "Home" if active == "Shiva" else active
              labels=[("Home",""),("Draft","◫"),("Guide","▤"),("Coach","✦")]
              with st.container(key="bottom_nav_shell"):
                  cols=st.columns(4,gap="small")
                  for i,(page_name,icon) in enumerate(labels):
                      with cols[i]:
                          if st.button(f"{icon}  {page_name}",key=f"primary_nav_{page_name}",type="primary" if active==page_name else "secondary",use_container_width=True):
                              st.query_params["page"]=page_name
                              for k in ("player","hint","ret","draft"):
                                  try: del st.query_params[k]
                                  except Exception: pass
                              st.rerun()
          '''
          s,n=re.subn(r'def bottom_nav\(active:str\):.*?\n\ndef screen_head',nav+'\ndef screen_head',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'nav restore replacements={n}')
          s=s.replace('.bottom-nav{display:grid!important}', '.bottom-nav{display:none!important}', 1)
          s=s.replace('alt="The Shiva trophy"','alt="THE SHIVA trophy"',1)
          s=re.sub(r'/\* GLOBAL SHIVA SHELL RECOVERY - protected scope \*/.*?(?=\n</style>)','',s,count=1,flags=re.S)
          m=re.search(r'<img class="shiva-trophy-mark" src="data:image/jpeg;base64,([^\"]+)"',s)
          if not m: raise SystemExit('embedded Shiva mark not found')
          b64=m.group(1)
          css=f'''
          /* GLOBAL SHIVA SHELL RECOVERY - protected scope */
          .brand-badge .shiva-trophy-mark{{display:block!important;width:58px!important;height:70px!important;object-fit:contain!important;border-radius:0!important;filter:drop-shadow(0 5px 8px rgba(0,0,0,.32))!important}}
          .st-key-bottom_nav_shell [data-testid="stHorizontalBlock"]{{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;width:100%!important;gap:6px!important;flex-wrap:unset!important}}
          .st-key-bottom_nav_shell [data-testid="column"]{{width:auto!important;min-width:0!important;flex:unset!important}}
          .st-key-bottom_nav_shell .stButton>button{{width:100%!important;min-width:0!important}}
          .st-key-primary_nav_Home .stButton>button{{position:relative!important;padding-top:31px!important;line-height:1!important}}
          .st-key-primary_nav_Home .stButton>button::before{{content:""!important;position:absolute!important;top:4px!important;left:50%!important;transform:translateX(-50%)!important;width:27px!important;height:27px!important;background-image:url("data:image/jpeg;base64,{b64}")!important;background-position:center!important;background-size:contain!important;background-repeat:no-repeat!important;border-radius:2px!important}}
          '''
          needle="\n</style>'''"
          if needle not in s: raise SystemExit('CSS terminator not found')
          s=s.replace(needle,'\n'+css+needle,1)
          p.write_text(s,encoding='utf-8')
          print('SAME-SESSION NAV RESTORED')
          PY
      - name: Compile
        run: python -m py_compile app.py app_core.py shiva_home_v2.py shiva_product.py shiva_live.py shiva_coach.py shiva_draft_guide.py shiva_draft_iq.py
      - name: Contract assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('app_core.py').read_text()
          assert '<img class="shiva-trophy-mark"' in core
          assert 'THE SHIVA trophy' in core
          assert 'labels=[("Home",""),("Draft","◫"),("Guide","▤"),("Coach","✦")]' in core
          assert 'primary_nav_' in core and 'st.rerun()' in core
          assert '.st-key-primary_nav_Home' in core
          assert 'grid-template-columns:repeat(4,minmax(0,1fr))' in core
          for name in ['render_draft_guide','render_full_product','render_home_v2','render_shiva_draft_iq']:
              assert name in core, name
          print('CONTRACT PASS')
          PY
      - name: Runtime smoke
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for page in ['Home','Draft','Guide','Coach']:
              at=AppTest.from_file('app.py')
              at.query_params['page']=page
              at.run(timeout=45)
              if len(at.exception): raise SystemExit(f'{page}: {at.exception}')
              print('RUNTIME PASS',page)
          PY
      - name: Product and UX audits
        run: |
          python scripts/audit_product.py
          python scripts/audit_ux_v3.py
      - name: Commit narrow recovery and remove scaffolding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm scripts/recover_global_shell.py .github/workflows/global-shell-recovery-audit.yml
          git add -A
          git commit -m 'Restore Shiva global identity and four-button navigation'
          git push
