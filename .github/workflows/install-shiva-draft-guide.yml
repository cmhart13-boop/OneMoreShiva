name: Install Shiva Draft Guide
on:
  workflow_dispatch:
  push:
    paths:
      - 'shiva_draft_guide.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          if 'from shiva_draft_guide import render_draft_guide' not in s:
              anchor='import streamlit.components.v1 as components\n'
              s=s.replace(anchor,anchor+'from shiva_draft_guide import render_draft_guide\n',1)
          s=s.replace('PAGES = ["Home","Draft","Players","Shiva","Roster"]','PAGES = ["Home","Draft","Guide","Players","Shiva","Roster"]')
          s=s.replace('ICONS = {"Home":"⌂","Draft":"🏈","Players":"👥","Shiva":"✦","Roster":"☷"}','ICONS = {"Home":"⌂","Draft":"🏈","Guide":"📖","Players":"👥","Shiva":"✦","Roster":"☷"}')
          old='grid-template-columns:repeat(5,1fr);padding:6px 8px calc(8px + env(safe-area-inset-bottom))'
          s=s.replace(old,'grid-template-columns:repeat(6,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom))')
          if 'def draft_guide():' not in s:
              marker='def draft():\n'
              s=s.replace(marker,'def draft_guide():\n    screen_head("2026 Shiva Draft Guide","Full-PPR intelligence built for draft-day decisions.")\n    render_draft_guide()\n\n'+marker,1)
          oldroute='{"Home":home,"Draft":draft,"Players":player_db,"Shiva":shiva,"Roster":roster_screen}[page]()'
          newroute='{"Home":home,"Draft":draft,"Guide":draft_guide,"Players":player_db,"Shiva":shiva,"Roster":roster_screen}[page]()'
          s=s.replace(oldroute,newroute)
          # Add the Guide to the existing home quick-launch grid without altering the established card design.
          needle='f\'<a class="quick-card" href="{page_href("Players")}" target="_self"><div class="quick-icon">👥</div><div class="quick-title">Players</div><div class="quick-sub">Profiles and weekly history</div></a>\''
          guide='f\'<a class="quick-card" href="{page_href("Guide")}" target="_self"><div class="quick-icon">📖</div><div class="quick-title">2026 Draft Guide</div><div class="quick-sub">PPR board, strategy and research</div></a>\'+'
          if 'quick-title">2026 Draft Guide' not in s and needle in s:
              s=s.replace(needle,guide+needle,1)
          p.write_text(s)
          PY
      - name: Verify syntax and wiring
        run: |
          python -m py_compile app.py shiva_draft_guide.py
          grep -q '"Guide":draft_guide' app.py
          grep -q 'render_draft_guide' app.py
      - name: Commit patch
        run: |
          git config user.name 'Shiva App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add 2026 Shiva Draft Guide to mobile navigation'
            git push
          fi
