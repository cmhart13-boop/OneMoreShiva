name: Fix Shiva Blast Layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-shiva-blast-layout.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('app.py'); s=p.read_text(); old=\"try{if(window.frameElement){window.frameElement.style.height='650px';}}catch(e){}\"; new=\"try{window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:650},'*');if(window.frameElement){window.frameElement.style.height='650px';}}catch(e){}\"; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Shiva Blast video overlap with ESPN sections"
          git push
