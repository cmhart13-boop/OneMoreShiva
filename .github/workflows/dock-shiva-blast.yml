name: Dock Shiva Blast
on:
  push:
    paths:
      - '.github/scripts/dock_shiva_blast.py'
      - '.github/workflows/dock-shiva-blast.yml'
permissions:
  contents: write
jobs:
  dock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dock Shiva Blast beside data status
        run: python .github/scripts/dock_shiva_blast.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Dock Shiva Blast beside data status"
          git push
