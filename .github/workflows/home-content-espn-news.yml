name: Homepage ESPN fantasy news patch
on:
  push:
    paths:
      - .github/workflows/home-content-espn-news.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage content only
        run: echo '' | base64 -d > /tmp/patch.py && python /tmp/patch.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit homepage patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/home-content-espn-news.yml
          git add -A
          git commit -m "Replace homepage draft content with ESPN fantasy news"
          git push
