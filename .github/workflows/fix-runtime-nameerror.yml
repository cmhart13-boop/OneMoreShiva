name: Fix Runtime NameError

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-runtime-nameerror.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dead Shiva Blast hook and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          p=Path('app_core.py')
          s=p.read_text(encoding='utf-8')
          old='    _home_shiva_blast()\n'
          if old not in s:
              raise SystemExit('Expected dead hook not found')
          s=s.replace(old,'',1)
          ast.parse(s)
          assert '_home_shiva_blast()' not in s
          assert 'def app_header():' in s
          assert 'def home():' in s
          assert 'render_nfl_kickoff_countdown()' in s
          p.write_text(s,encoding='utf-8')
          print('RUNTIME NAMEERROR FIX VALIDATED')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_core.py
          git commit -m 'Fix startup NameError in app header'
          git push
