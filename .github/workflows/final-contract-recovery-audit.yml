name: Final Shiva Execution Contract Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-contract-recovery-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Compile production
        run: python -m py_compile app.py app_core.py shiva_home_v2.py shiva_product.py shiva_live.py shiva_coach.py shiva_draft_guide.py shiva_draft_iq.py scripts/audit_product.py scripts/audit_ux_v3.py scripts/update_live_context.py
      - name: Final contract assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('app_core.py').read_text();h=Path('shiva_home_v2.py').read_text();d=Path('shiva_draft_iq.py').read_text();g=Path('shiva_draft_guide.py').read_text();p=Path('shiva_product.py').read_text();l=Path('shiva_live.py').read_text()
          # Global shell
          assert 'THE SHIVA trophy' in a and '<img class="shiva-trophy-mark"' in a
          assert 'labels=[("Home",""),("Draft","◫"),("Guide","▤"),("Coach","✦")]' in a
          assert 'primary_nav_' in a and 'st.rerun()' in a and '.st-key-primary_nav_Home' in a
          # Home
          for x in ['Shiva Says','Your War Room','The Shiva Edge','Shiva Blast','news-thumb']:
              assert x in h,x
          assert 'font-size:31px' in h and 'target="_blank"' in h
          # Draft
          assert 'get_draft_recommendations' in d and 'LIVE DRAFT CONTEXT' in d
          assert 'render_draft_moment' in a and 'render_draft_board' in a and 'Queue' in a and 'Roster' in a
          # Guide
          assert '_current_board(players)' in g and '_historical_rows(players,load_weekly,weekly_name_col,espn_ppr)' in g
          assert 'Verified historical Full-PPR evidence' in g and 'guide-player-link' in g
          # Coach + supporting
          for x in ['Start/Sit','Waivers','Trades','Lineup','Watch','Analysts','League','CURRENT ESPN CONTEXT','Trade partner','SHIVA POWER BOARD']:
              assert x in p,x
          assert 'team_game_context' in l and 'fetch_league' in l and 'fetch_player_pool' in l
          print('FINAL CONTRACT ASSERTIONS PASS')
          PY
      - name: Product and UX audits
        run: |
          python scripts/audit_product.py
          python scripts/audit_ux_v3.py
      - name: Runtime all protected destinations
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for page in ['Home','Draft','Guide','Coach']:
              at=AppTest.from_file('app.py')
              at.query_params['page']=page
              at.run(timeout=45)
              if len(at.exception): raise SystemExit(f'{page}: {at.exception}')
              print('FINAL RUNTIME PASS',page)
          PY
      - name: Repository hygiene before cleanup
        run: |
          test ! -f scripts/recover_global_shell.py
          test ! -f scripts/recover_guide.py
          test ! -f scripts/recover_coach.py
          test ! -f scripts/recover_supporting.py
          test ! -f .github/workflows/global-shell-recovery-audit.yml
          test ! -f .github/workflows/guide-recovery-audit.yml
          test ! -f .github/workflows/coach-recovery-audit.yml
          test ! -f .github/workflows/supporting-recovery-audit.yml
          test -f .github/workflows/shiva-live-context.yml
          echo REPOSITORY HYGIENE PASS
      - name: Remove final audit workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/final-contract-recovery-audit.yml
          git add -A
          git commit -m 'Remove final recovery audit scaffolding'
          git push
