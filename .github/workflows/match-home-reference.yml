name: Match Home Reference
on:
  push:
    paths:
      - '.github/scripts/match_home_reference.py'
      - '.github/workflows/match-home-reference.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Shiva Draft Intelligence reference styling
        run: python .github/scripts/match_home_reference.py
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Apply exact Shiva Draft Intelligence homepage styling"
          git push
