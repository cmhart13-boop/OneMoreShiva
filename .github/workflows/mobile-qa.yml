name: Shiva Mobile QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build checked-out Shiva batch
        run: npm run build

      - name: Start checked-out Shiva batch
        run: |
          npm run start -- -H 0.0.0.0 > /tmp/shiva-next.log 2>&1 &
          echo $! > /tmp/shiva-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              echo "Local Shiva batch is healthy"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/shiva-next.log
          echo "Local Shiva batch did not become healthy"
          exit 1

      - name: Run rendered QA against checked-out batch
        env:
          SHIVA_BASE_URL: http://127.0.0.1:3000
        run: npm run test:mobile

      - name: Upload phone screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiva-mobile-qa-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            /tmp/shiva-next.log
          if-no-files-found: ignore
          retention-days: 14
