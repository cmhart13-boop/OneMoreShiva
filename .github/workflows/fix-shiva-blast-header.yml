name: Update ESPN Fantasy News

on:
  push:
    paths:
      - '.github/shiva-blast-header-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Home ESPN fantasy news block only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def _home_nfl_news():')
          end=s.index('\ndef home():',start)
          new_fn=base64.b64decode('').decode('utf-8')
          s=s[:start]+new_fn+s[end:]
          p.write_text(s,encoding='utf-8')
          block=s[s.index('def _home_nfl_news():'):s.index('\ndef home():',s.index('def _home_nfl_news():'))]
          assert '#### Fantasy News' in block
          assert 'site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=100' in block
          assert 'if len(articles)==4:break' not in block
          assert 'target="_blank"' in block
          assert 'candidate.get("url")' in block
          print('ESPN FANTASY NEWS CONTRACT PASSED')
          PY

      - name: Syntax check
        run: python -m py_compile app.py app_core.py shiva_draft_guide.py shiva_draft_iq.py

      - name: Commit verified Fantasy News change
        shell: bash
        run: |
          git config user.name "Shiva News Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/shiva-blast-header-trigger
          git add app.py .github/shiva-blast-header-trigger
          git commit -m "Show live ESPN Fantasy News on Home" || exit 0
          git push
