name: Fix Shiva Blast Header

on:
  push:
    paths:
      - '.github/shiva-blast-header-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Change only Shiva Blast header control
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def _home_shiva_blast():')
          end=s.index('\ndef _home_nfl_news():',start)
          fn=r'''def _home_shiva_blast():
    components.html(r"""
    <style>
      html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
      #wrap{width:100%;box-sizing:border-box;background:transparent}
      #bar{display:flex;justify-content:flex-end;align-items:center;height:36px}
      #shivaBlast{width:122px;height:34px;border-radius:8px;border:1px solid rgba(74,156,255,.48);background:linear-gradient(135deg,rgba(37,140,255,.78),rgba(20,91,171,.62) 58%,rgba(11,48,91,.48));color:#fff;font-weight:900;font-size:9px;letter-spacing:.12px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 14px rgba(23,112,207,.18);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
      #shivaBlast svg{width:18px;height:18px;flex:0 0 18px}
      #shivaBlast.playing{background:linear-gradient(135deg,rgba(32,125,230,.88),rgba(15,72,140,.72));border-color:rgba(104,181,255,.62)}
      #shivaBlast:active{transform:translateY(1px)}
      #stage{display:none;margin-top:7px;width:100%;background:transparent}
      #stage.open{display:block}
      #blastVideo{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain;border-radius:12px;background:#000;box-shadow:0 12px 34px rgba(0,0,0,.42);cursor:pointer}
    </style>
    <div id="wrap">
      <div id="bar"><button id="shivaBlast" aria-label="Shiva Blast"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 51c2-7 2-10-1-14-3-4-4-9-3-14 2-9 10-15 20-15 11 0 20 8 20 19 0 6-2 10-6 14-2 2-3 5-3 10"/><path d="M23 18h9l4-4m-13 11h15l5-5m-20 12h12l5 5m-17 2h10l4 5m4-27h7m-6 8h10m-9 8h8"/><circle cx="36" cy="14" r="1.6" fill="#fff"/><circle cx="43" cy="20" r="1.6" fill="#fff"/><circle cx="40" cy="37" r="1.6" fill="#fff"/><circle cx="37" cy="44" r="1.6" fill="#fff"/></g><path d="M20 27l2.4 5.1L28 34.5l-5.6 2.4L20 42l-2.4-5.1-5.6-2.4 5.6-2.4z" fill="#fff"/></svg><span id="blastLabel">SHIVA BLAST</span></button></div>
      <div id="stage"><video id="blastVideo" playsinline preload="auto"><source src="https://raw.githubusercontent.com/cmhart13-boop/OneMoreShiva/main/Blasting_compressed.mp4" type="video/mp4"></video></div>
    </div>
    <script>
      const btn=document.getElementById('shivaBlast');const label=document.getElementById('blastLabel');const stage=document.getElementById('stage');const video=document.getElementById('blastVideo');const frame=window.frameElement;let playing=false;
      const closedFrame=()=>{try{if(!frame)return;frame.style.position='absolute';frame.style.top='6px';frame.style.right='8px';frame.style.left='auto';frame.style.bottom='auto';frame.style.width='122px';frame.style.height='36px';frame.style.zIndex='20';frame.style.border='0';frame.style.background='transparent';frame.style.boxShadow='none';frame.style.margin='0';}catch(e){}};
      const openFrame=()=>{try{if(!frame)return;frame.style.position='relative';frame.style.top='auto';frame.style.right='auto';frame.style.left='auto';frame.style.bottom='auto';frame.style.width='100%';frame.style.height=Math.min(Math.max(document.documentElement.scrollHeight+8,250),680)+'px';frame.style.zIndex='10';frame.style.border='0';frame.style.background='transparent';frame.style.margin='2px 0 8px';}catch(e){}};
      const syncOpenHeight=()=>{if(!playing||!frame)return;try{frame.style.height=Math.min(Math.max(document.documentElement.scrollHeight+8,250),680)+'px';}catch(e){}};
      const closeBlast=()=>{playing=false;video.pause();video.currentTime=0;video.controls=false;stage.classList.remove('open');btn.classList.remove('playing');label.textContent='SHIVA BLAST';closedFrame();};
      const openBlast=()=>{playing=true;stage.classList.add('open');btn.classList.add('playing');label.textContent='STOP BLAST';openFrame();video.currentTime=0;video.muted=false;requestAnimationFrame(syncOpenHeight);const p=video.play();if(p&&p.catch)p.catch(()=>{video.controls=true;syncOpenHeight();});};
      btn.addEventListener('click',()=>playing?closeBlast():openBlast());video.addEventListener('click',closeBlast);video.addEventListener('ended',()=>setTimeout(closeBlast,100));video.addEventListener('loadedmetadata',syncOpenHeight);try{new ResizeObserver(syncOpenHeight).observe(document.getElementById('wrap'));}catch(e){}closedFrame();
    </script>
    """,height=36,scrolling=False)
'''
          s=s[:start]+fn+s[end:]
          # Remove the old Data Live pill visually; Shiva Blast occupies that header slot.
          marker="mobile_css = r'''"
          s=s.replace(marker, marker+"\n.data-status{display:none!important}\n",1)
          p.write_text(s,encoding='utf-8')
          block=s[s.index('def _home_shiva_blast():'):s.index('\ndef _home_nfl_news():',s.index('def _home_shiva_blast():'))]
          assert 'position=\'absolute\'' in block
          assert '#258cff' not in block or True
          assert 'SHIVA BLAST' in block and '<svg viewBox="0 0 64 64"' in block
          assert '.data-status{display:none!important}' in s
          PY
      - name: Syntax check
        run: python -m py_compile app.py app_core.py shiva_draft_guide.py shiva_draft_iq.py
      - name: Commit change
        shell: bash
        run: |
          git config user.name "Shiva App Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/shiva-blast-header-trigger
          git add app.py .github/shiva-blast-header-trigger
          git commit -m "Replace Data Live with blue Shiva Blast control" || exit 0
          git push
