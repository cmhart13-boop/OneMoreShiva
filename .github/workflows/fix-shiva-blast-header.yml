name: Fix Shiva Blast header behavior

on:
  push:
    paths:
      - '.github/shiva-blast-header-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Shiva Blast page-anchored, not viewport-fixed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = "const closedFrame=()=>{try{if(!frame)return;frame.style.position='fixed';frame.style.top='8px';frame.style.right='8px';frame.style.left='auto';frame.style.bottom='auto';frame.style.width='104px';frame.style.height='34px';frame.style.zIndex='2147483000';frame.style.border='0';frame.style.background='transparent';frame.style.boxShadow='none';frame.style.margin='0';}catch(e){}};"
          new = "const closedFrame=()=>{try{if(!frame)return;frame.style.position='absolute';frame.style.top='8px';frame.style.right='8px';frame.style.left='auto';frame.style.bottom='auto';frame.style.width='104px';frame.style.height='34px';frame.style.zIndex='20';frame.style.border='0';frame.style.background='transparent';frame.style.boxShadow='none';frame.style.margin='0';}catch(e){}};"

          if old not in s:
              raise SystemExit('Expected current Shiva Blast closedFrame implementation not found; refusing broad edit.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Contract checks: only behavior requested here.
          assert "frame.style.position='absolute';frame.style.top='8px';frame.style.right='8px'" in s
          assert "frame.style.position='fixed';frame.style.top='8px';frame.style.right='8px'" not in s
          assert "frame.style.position='relative'" in s
          assert "video.addEventListener('click',closeBlast)" in s
          assert "video.addEventListener('ended'" in s
          print('SHIVA BLAST HEADER CONTRACT PASSED')
          PY

      - name: Syntax check
        run: python -m py_compile app.py app_core.py shiva_draft_guide.py shiva_draft_iq.py

      - name: Commit verified surgical fix
        shell: bash
        run: |
          git config user.name "Shiva Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/shiva-blast-header-trigger
          git add app.py .github/shiva-blast-header-trigger
          git commit -m "Anchor Shiva Blast to page header" || exit 0
          git push
