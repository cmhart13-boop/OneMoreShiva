name: Inspect Shiva UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-shiva-ui.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current UI hooks
        run: |
          python - <<'PY'
          import ast,re
          for fn in ['app_core.py','shiva_product.py','shiva_draft_guide.py']:
              s=open(fn,encoding='utf-8').read(); t=ast.parse(s)
              print('\n###',fn)
              print('FUNCTIONS:', ', '.join(n.name for n in t.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))))
              for pat in ['countdown','news','blast','app_header','bottom_nav','def home','data-status','hero','coach-','guide_tab','page_href']:
                  print('\n--',pat)
                  for i,line in enumerate(s.splitlines(),1):
                      if pat.casefold() in line.casefold():
                          print(i, line[:500])
          PY
