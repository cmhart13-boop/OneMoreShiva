name: Finish Shiva Coach

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-shiva-coach.yml'

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire final Coach dependencies
        run: python tools/finish_coach.py
      - name: Syntax check
        run: python -m py_compile app.py app_core.py shiva_coach.py shiva_draft_guide.py shiva_draft_iq.py
      - name: Commit final Coach wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_core.py shiva_coach.py
          git commit -m 'Complete Shiva Coach modules'
          git push
