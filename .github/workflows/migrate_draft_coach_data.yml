name: Migrate Draft Coach data into OneMoreShiva

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate_draft_coach_data.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy authoritative data files into OneMoreShiva
        run: |
          curl -L --fail --retry 3 -o current_rankings.csv https://raw.githubusercontent.com/cmhart13-boop/Draft-Coach/main/current_rankings.csv
          curl -L --fail --retry 3 -o player_weekly_master_2014_2025.csv.gz https://raw.githubusercontent.com/cmhart13-boop/Draft-Coach/main/player_weekly_master_2014_2025.csv.gz
          test -s current_rankings.csv
          test -s player_weekly_master_2014_2025.csv.gz

      - name: Make OneMoreShiva self-contained and install visible kickoff countdown
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path('app_core.py')
          s = p.read_text(encoding='utf-8')

          if 'from pathlib import Path\n' not in s:
              s = s.replace('import os\n', 'import os\nfrom pathlib import Path\n', 1)

          s = s.replace(
              'RANKINGS_URL = "https://raw.githubusercontent.com/cmhart13-boop/Draft-Coach/main/current_rankings.csv"',
              'RANKINGS_URL = str(Path(__file__).with_name("current_rankings.csv"))',
              1,
          )
          s = s.replace(
              'WEEKLY_URL = "https://raw.githubusercontent.com/cmhart13-boop/Draft-Coach/main/player_weekly_master_2014_2025.csv.gz"',
              'WEEKLY_URL = str(Path(__file__).with_name("player_weekly_master_2014_2025.csv.gz"))',
              1,
          )

          if 'def render_nfl_kickoff_countdown():' not in s:
              marker = 'def home():\n    screen_head('
              helper = dedent('''
                  def render_nfl_kickoff_countdown():
                      components.html(
                          r"""<style>
                          *{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
                          .kickoff{height:42px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 9px;border:1px solid rgba(116,227,210,.20);border-radius:8px;background:#0d1821;color:#f4f7f9}
                          .label{font-size:9px;font-weight:900;letter-spacing:.65px;text-transform:uppercase;color:#74e3d2;white-space:nowrap}
                          .time{font-size:14px;font-weight:900;letter-spacing:-.2px;white-space:nowrap;font-variant-numeric:tabular-nums}
                          .sub{font-size:8px;color:#8fa0ae;font-weight:800;white-space:nowrap}
                          @media(max-width:390px){.kickoff{gap:6px;padding-left:7px;padding-right:7px}.time{font-size:13px}.sub{display:none}}
                          </style>
                          <div class="kickoff" role="timer" aria-label="Countdown to the 2026 NFL kickoff game">
                            <span class="label">NFL KICKOFF</span>
                            <span class="time" id="shivaKickoffClock">--d --h --m --s</span>
                            <span class="sub">SEP 9 · 8:20 PM ET</span>
                          </div>
                          <script>
                          (function(){
                            const target = new Date('2026-09-09T20:20:00-04:00').getTime();
                            const el = document.getElementById('shivaKickoffClock');
                            function tick(){
                              const diff = Math.max(0, target - Date.now());
                              const days = Math.floor(diff / 86400000);
                              const hours = Math.floor((diff % 86400000) / 3600000);
                              const mins = Math.floor((diff % 3600000) / 60000);
                              const secs = Math.floor((diff % 60000) / 1000);
                              el.textContent = days + 'd ' + String(hours).padStart(2,'0') + 'h ' + String(mins).padStart(2,'0') + 'm ' + String(secs).padStart(2,'0') + 's';
                            }
                            tick();
                            setInterval(tick,1000);
                          })();
                          </script>""",
                          height=46,
                          scrolling=False,
                      )


                  def home():
                      render_nfl_kickoff_countdown()
                      screen_head(
              ''')
              if marker not in s:
                  raise SystemExit('Could not find home() insertion point')
              s = s.replace(marker, helper, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate migration
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path
          import pandas as pd

          rankings = Path('current_rankings.csv')
          weekly = Path('player_weekly_master_2014_2025.csv.gz')
          assert rankings.stat().st_size > 10000
          assert weekly.stat().st_size > 1000000
          df = pd.read_csv(rankings)
          assert {'player_name','position','adp'}.issubset(df.columns)
          with gzip.open(weekly, 'rb') as f:
              assert f.read(2)
          src = Path('app_core.py').read_text(encoding='utf-8')
          assert 'Draft-Coach/main/current_rankings.csv' not in src
          assert 'Draft-Coach/main/player_weekly_master_2014_2025.csv.gz' not in src
          assert 'def render_nfl_kickoff_countdown():' in src
          assert 'render_nfl_kickoff_countdown()' in src
          print('migration validation passed')
          PY

      - name: Commit migrated files and app changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add current_rankings.csv player_weekly_master_2014_2025.csv.gz app_core.py
          git commit -m 'Make OneMoreShiva self-contained'
          git push
