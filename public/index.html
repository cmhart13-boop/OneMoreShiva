<!doctype html>
<html lang="en" style="background:#071019;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shiva">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/static/shiva-trophy.png">
<title>Shiva</title>
<style>
:root,html,body{margin:0;width:100%;height:100%;min-height:100%;background:#071019!important;color-scheme:dark;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071019;opacity:0}
#launch{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#071019;opacity:1;visibility:visible;transition:opacity .22s ease-out,visibility 0s linear .22s}
#launch.hide{opacity:0;visibility:hidden;pointer-events:none}
#launch img{display:block;width:min(88vw,520px);height:auto;max-height:82dvh;object-fit:contain;mix-blend-mode:lighten}
</style>
</head>
<body>
<iframe id="app" src="/app" title="Shiva Intelligence"></iframe>
<div id="launch" aria-label="Shiva loading"><img src="/app/static/shiva-trophy.png" alt="The Shiva trophy"></div>
<script>
(() => {
 const frame=document.getElementById('app'), launch=document.getElementById('launch');
 const started=performance.now();
 let done=false;
 const reveal=()=>{if(done)return;done=true;const wait=Math.max(0,1800-(performance.now()-started));setTimeout(()=>{frame.style.opacity='1';launch.classList.add('hide');setTimeout(()=>launch.remove(),260)},wait)};
 const inspect=()=>{try{if(frame.contentDocument&&frame.contentDocument.querySelector('.app-top'))return reveal()}catch(_){}setTimeout(inspect,80)};
 frame.addEventListener('load',inspect);
 setTimeout(reveal,8000);
})();
</script>
</body>
</html>
